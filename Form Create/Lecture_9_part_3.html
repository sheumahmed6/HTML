<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Complex Form</h1>

    <form >

        <fieldset>
            <legend>Personal Information</legend>

        <label for="Name1">Name</label>
        <input type="text" id="Name1" name="Name1">

        <label for="Email1">Email</label>
        <input type="text" id="Email1" name="Email1">


        <label for="phone1">Phone</label>
        <input type="text" id="phone1" name="phone1">

        <label for="date1">Date of Birth </label>
        <input type="date" id="date1" name="date1" placeholder="dd/mm/yy">


         <label for="radio1">Gender</label>
        <input type="radio" id="radio1" name="radio1">
        <label for="radio1">Male</label>

        <input type="radio" id="radio2" name="radio2">
        <label for="radio2">Female</label>

        <label for="county1">Country</label>
        <select name="county1" id="county1">
            <option value="Bangladesh">Bangladesh</option>
            <option value="USA">USA</option>
            <option value="India">India</option>
            <option value="Pakistan">Pakistan</option>
            
        </select>



        </fieldset>

        <fieldset>
            <legend id="address1">Address
                <label for="street1">Street: </label>
            <input type="text" id="street1" name="street1">

             <label for="city1">City: </label>
            <input type="text" id="city1" name="city1">


             <label for="state1">State: </label>
            <input type="text" id="state1" name="state1">

            <label for="zipcode1">Zipcode: </label>
            <input type="text" id="zipcode1" name="zipcode1">
            </legend>
         
            
            
        </fieldset>


        <fieldset>
            <legend>Other Information</legend>


            <label for="textarea1">Comments</label>
            <textarea name="textarea1" id="textarea1"></textarea>


            <label for="checkbox1"> I agree to the terms of service</label>
            <input type="checkbox" id="checkbox1">


            
        </fieldset>

        <input type="submit" id="">
    </form>
    
</body>
</html>
