<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <h1>Event Registration</h1>
    <form >
        <label for="Name1"> Name:</label>

        <input type="text" name="Name1" id="Name1">
         <br> <br/> 
         <label for="email"> Email ID:</label>

        <input type="text" name="email" id="email">
         <br> <br/> 

          <label for="phoneNo">Phone No. :</label>
        <!-- <br> <br/> -->
        <input type="text" name="phoneNo" id="phoneNo">
        <br> <br/>

         <label for="OccupationType">Occupation Type :</label>

          <br> <br/>

        <fieldset>
            <legend>Topics of Interest</legend>

            <input type="checkbox" name="checkbox1" id="checkbox1">
            
            <label for="checkbox2">CSS</label>
            
            <input type="checkbox" name="checkbox2" id="checkbox2">

            <label for="checkbox3">JAVA SCRIPT</label>
            
            <input type="checkbox" name="checkbox3" id="checkbox3">



        </fieldset>

         <label for="textarea1">Comment</label>
         <br> <br/>
        <textarea name="textarea1" id="textarea1" placeholder="Comment here"cols="30" rows="10"></textarea>
         <br> <br/>
      <input type="submit" value="Register">

    </form>
